<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MFA TOTP</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #22b8cf, #4c6ef5);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 350px;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 26px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 8px;
            border: 2px solid #4c6ef5;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #22b8cf;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #4c6ef5;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #364fc7;
        }

        .note {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login</h2>

        <form action="/login" method="POST">
            <label>Email</label>
            <input type="email" name="email" >

            <label>Password</label>
            <input type="password" name="password" >

            <button type="submit">Continue</button>

            
        </form>
    </div>

</body>
</html>
