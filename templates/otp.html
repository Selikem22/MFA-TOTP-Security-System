<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4c6ef5, #22b8cf);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 22px;
        }

        .note {
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 18px;
            border: 2px solid #4c6ef5;
            border-radius: 8px;
            outline: none;
            text-align: center;
            letter-spacing: 4px;
        }

        input:focus {
            border-color: #22b8cf;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #4c6ef5;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #364fc7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Enter OTP</h2>
        <p class="note">Enter the 6-digit code generated </p>

        <form method="POST" action="{{ url_for('verify_otp') }}">
  <input type="text" name="otp" maxlength="6" required>
  <button type="submit">Verify OTP</button>
</form>
</body>
</html>
